<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Class 10 ke liye free Euclid Division Algorithm calculator. Euclid Vibhajan vidhi se HCF calculate karein aur A = BQ + R ke steps dekhein.">

    <title>Euclid Algorithm Calculator | Euclid Vibhajan | Class 10</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Euclid's Algorithm</h1>

        <p class="subtitle">Class 10 Mathematics</p>

        <div class="card">

            <input id="a" type="number" placeholder="Enter value of A">

            <input id="b" type="number" placeholder="Enter value of B">

            <div class="buttons">
                   <button onclick="calculate()">Calculate HCF</button>
                   <button onclick="clearApp()" class="clear-btn">Clear</button>
            </div>

          <div id="result"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
