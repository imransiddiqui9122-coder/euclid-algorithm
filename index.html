<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euclid's Algorithm</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Euclid's Algorithm</h1>

        <p class="subtitle">Class 10 Mathematics</p>

        <div class="card">

            <input id="a" type="number" placeholder="Enter value of A">

            <input id="b" type="number" placeholder="Enter value of B">
                 <div class="choice">
    <label>
        <input type="radio" name="operation" value="hcf" checked>
        HCF
    </label>

    <label>
        <input type="radio" name="operation" value="lcm">
        LCM
    </label>

    <label>
        <input type="radio" name="operation" value="both">
        HCF + LCM
    </label>
</div>

<div class="buttons">
    <button id="calculateBtn" onclick="calculate()">Calculate HCF</button>
    <button onclick="clearApp()" class="clear-btn">Clear</button>
</div>

<div id="result"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
